<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Profile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <button type="button" id="theme-toggle">Dark Mode</button>
    <h1>Your Name</h1>
    <p>Student &amp; Aspiring Developer</p>
  </header>

  <main>
    <section id="introduction">
      <h2>Introduction</h2>
      <p>Write a short introduction about yourself here.</p>
    </section>

    <section id="education">
      <h2>Education</h2>
      <p>B.Tech in Computer Science — Your University Name</p>
    </section>

    <section id="skills">
      <h2>Skills</h2>
      <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>C++</li>
        <li>Python</li>
        <li>Java</li>
      </ul>
    </section>

    <section id="quiz">
      <h2>Quiz</h2>
      <div id="quiz-container">
        <p id="quiz-progress"></p>
        <p id="quiz-question"></p>
        <div id="quiz-options"></div>
        <button type="button" id="quiz-next">Next</button>
        <p id="quiz-score"></p>
        <button type="button" id="quiz-restart">Restart Quiz</button>
      </div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Email: your.email@example.com</p>
      <button type="button">Contact Me</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
